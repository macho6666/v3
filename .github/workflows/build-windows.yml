name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Syntax check
        shell: pwsh
        run: |
          python -c "import pathlib, py_compile; [py_compile.compile(str(p), doraise=True) for p in pathlib.Path('.').rglob('*.py')]"

      - name: Import test
        shell: pwsh
        run: |
          python -c "import selenium"
          python -c "from app.ui import MainWindow"

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --collect-all selenium `
            --name EpubHeadingTool `
            main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: EpubHeadingTool-Windows
          path: dist/EpubHeadingTool.exe
